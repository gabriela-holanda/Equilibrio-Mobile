<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Equilíbrio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Josefin+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="app.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">

    <meta name="theme-color" content="#5c6cff">
</head>

<body>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>


    <!-- =========================
         TELA DE LOGIN / CADASTRO
    ========================== -->

    <section id="authView" class="auth-view">

        <div class="auth-card">

            <div class="brand big">
                ✦ <span>Equilíbrio</span>
            </div>

            <p>
                Organize sua rotina, conheça seus padrões
                e acompanhe seu dia.
            </p>


            <!-- ABAS -->

            <div class="auth-tabs">

                <button
                    class="active"
                    data-auth="login">
                    Entrar
                </button>

                <button
                    data-auth="register">
                    Criar conta
                </button>

            </div>


            <!-- LOGIN -->

            <form id="loginForm">

                <label>
                    E-mail

                    <input
                        id="loginEmail"
                        type="email"
                        required>
                </label>


                <label>
                    Senha

                    <input
                        id="loginPassword"
                        type="password"
                        required>
                </label>


                <button
                    class="btn primary full">
                    Entrar
                </button>

            </form>


            <!-- CADASTRO -->

            <form
                id="registerForm"
                class="hidden">

                <label>
                    Nome completo

                    <input
                        id="regName"
                        required>
                </label>


                <label>
                    E-mail

                    <input
                        id="regEmail"
                        type="email"
                        required>
                </label>


                <label>
                    Senha

                    <input
                        id="regPassword"
                        type="password"
                        minlength="6"
                        required>
                </label>


                <div class="grid2">

                    <label>
                        Data de nascimento

                        <input
                            id="regBirth"
                            type="date">
                    </label>


                    <label>
                        Cidade

                        <input
                            id="regCity">
                    </label>

                </div>


                <button
                    class="btn primary full">
                    Criar minha conta
                </button>


                <small>
                    Você poderá completar o perfil depois.
                    Informações pessoais e de bem-estar são opcionais.
                </small>

            </form>

        </div>

    </section>



    <!-- =========================
         APLICAÇÃO
    ========================== -->

    <section
        id="appView"
        class="app hidden">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="brand">
                ✦ <span>Equilíbrio</span>
            </div>


            <!-- USUÁRIO -->

            <button
                class="user-mini"
                id="profileNav">

                <div
                    class="avatar"
                    id="avatarLetter">
                    E
                </div>

                <div>

                    <strong id="userName">
                        Usuário
                    </strong>

                    <small id="userEmail"></small>

                </div>

            </button>


            <!-- MENU -->

            <nav id="nav">


                <button
                    data-page="dashboard"
                    class="active">

                    ⌂
                    <span>Visão geral</span>

                </button>


                <button data-page="planner">

                    ✓
                    <span>Planner</span>

                </button>


                <button data-page="studies">

                    ▣
                    <span>Estudos</span>

                </button>


                <button data-page="wellness">

                    ♡
                    <span>Meu bem-estar</span>

                </button>


                <button data-page="habits">

                    ↻
                    <span>Hábitos</span>

                </button>


                <button data-page="diary">

                    ✎
                    <span>Diário</span>

                </button>


                <button data-page="reports">

                    ▥
                    <span>Relatórios</span>

                </button>


                <button data-page="history">

                    ◷
                    <span>Histórico</span>

                </button>


                <button data-page="assistant">

                    ✦
                    <span>Assistente</span>

                </button>


                <div class="nav-divider"></div>


                <button data-page="appointments">

                    ◫
                    <span>Marcar consulta</span>

                </button>


                <button data-page="professional">

                    ⚕
                    <span>Ajuda profissional</span>

                </button>


                <button data-page="contacts">

                    ☎
                    <span>Emergência</span>

                </button>


                <button data-page="documents">

                    ▤
                    <span>Documentos</span>

                </button>


                <button data-page="location">

                    ⌖
                    <span>Localização</span>

                </button>


                <button data-page="settings">

                    ⚙
                    <span>Configurações</span>

                </button>


                <button data-page="security">

                    ◈
                    <span>Segurança</span>

                </button>

            </nav>


            <!-- SAIR -->

            <button
                id="logoutBtn"
                class="logout">

                ↪ Sair

            </button>

        </aside>



        <!-- =========================
             CONTEÚDO PRINCIPAL
        ========================== -->

        <main class="main">


            <!-- TOPO -->

            <header class="topbar">

                <div>

                    <div
                        class="eyebrow"
                        id="todayLabel">
                    </div>

                    <h1 id="pageTitle">
                        Visão geral
                    </h1>

                </div>


                <div class="top-actions">

                    <button
                        class="icon-btn"
                        id="themeBtn">
                        ☾
                    </button>


                    <button
                        class="avatar"
                        id="profileQuick">
                        E
                    </button>

                </div>

            </header>


            <!-- PÁGINAS DINÂMICAS -->

            <div
                id="content"
                class="content">
            </div>

        </main>

    </section>



    <!-- MODAIS -->

    <div id="modalRoot"></div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>


    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker
                .register("sw.js")
                .catch(() => {});

        }

    </script>

</body>

</html>
